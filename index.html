<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151615"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>Film Note</title><link rel="stylesheet" href="./style.css"></head><body>
<main><header><h1>FILM NOTE</h1><span id="offline">準備中</span></header>
<div class="row"><select id="rollSelect" aria-label="フィルム選択"></select><button id="rollEdit">編集</button><button id="rollNew" aria-label="新しいロール">＋</button></div>
<div id="convert"><section><h2>フィルム側</h2>
<div class="seg"><button id="apMode">絞り優先</button><button id="ssMode">速度優先</button></div>
<label>シャッター速度 / 秒</label><div class="readout"><button id="ssMinus" aria-label="一段遅く">−</button><select id="filmSs" aria-label="シャッター速度"></select><button id="ssPlus" aria-label="一段速く">＋</button></div>
<label>F値</label><div class="readout"><button id="fMinus" aria-label="絞りを開く">−</button><select id="filmF" aria-label="F値"></select><button id="fPlus" aria-label="絞る">＋</button></div>
<p id="rounding" class="small"></p><div class="comp"><span class="small">露出補正</span><div class="row"><button id="evMinus">−</button><output id="ev">0 EV</output><button id="evPlus">＋</button></div></div></section>
<section><h2>露出の基準</h2><div class="row fields"><label>ISO<input id="refIso" type="number" min="1" max="102400" inputmode="numeric"></label><label>F値<select id="refF"></select></label><label>秒<select id="refSs"></select></label></div><p class="small">別のカメラで測った設定を入力</p></section>
<label style="margin-top:16px">次のコマ番号<input id="nextFrame" type="number" min="1" max="999" inputmode="numeric"></label><button id="record" class="primary" disabled>記録</button><p class="small caption">日時と設定をこの端末に保存</p></div>
<div id="logs" hidden><p id="count" class="small"></p><div id="entries"></div></div>
<div id="settings" hidden><section><h2>バックアップ</h2><p class="small">全ロール・記録・入力値をJSONで書き出します。サイトデータ削除や端末変更に備えて保存してください。</p><div class="row"><button id="export">書き出し</button><button id="import">読み込み</button></div><input id="importFile" type="file" accept=".json,application/json" hidden></section><section><h2>保存について</h2><p class="small">記録は端末内に保存します。通常の終了・再起動で残りますが、サイトデータの削除などで消える場合があります。Safariとホーム画面アプリで保存領域が異なる場合があるため、使う入口を固定してください。</p><p class="small">初回はオンラインで「オフライン準備完了」を確認してからホーム画面へ追加してください。</p><button id="persist">保存領域の保持をリクエスト</button><p id="persistStatus" class="small"></p></section></div></main>
<nav><button data-tab="convert" class="active">換算</button><button data-tab="logs">記録</button><button data-tab="settings">設定</button></nav>
<dialog id="rollDialog"><form id="rollForm"><h2 id="rollTitle">フィルム</h2><label>銘柄<input id="brand" placeholder="例：FUJICOLOR 100" maxlength="100" required></label><label>ISO<input id="rollIso" type="number" min="1" max="102400" required></label><div class="row"><button type="button" id="cancelRoll">戻る</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="shotDialog"><form id="shotForm"><h2>記録を編集</h2><label>コマ番号<input id="editFrame" type="number" min="1" max="999" required></label><label>日時<input id="editDate" type="datetime-local" required></label><div class="row fields"><label>ISO<input id="editIso" type="number" min="1" max="102400" required></label><label>F値<select id="editF"></select></label><label>秒<select id="editSs"></select></label></div><div class="row"><button type="button" id="cancelShot">戻る</button><button type="submit" class="primary">保存</button></div></form></dialog>
<div id="message" role="status" hidden></div><script src="./app.js"></script></body></html>
