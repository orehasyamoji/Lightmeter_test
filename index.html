<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightmeter test</title>
<style>
body{margin:16px;background:#111;color:#eee;font:16px system-ui}
button{font:inherit;padding:12px;margin:0 8px 12px 0}
video{display:block;width:100%;max-height:40vh;background:#222}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
</style>
<h1>Lightmeter test</h1>
<button id="start">カメラ開始</button><button id="stop" disabled>停止</button>
<video id="video" autoplay muted playsinline></video>
<p id="status">開始すると背面カメラを開きます。映像は保存・送信しません。</p>
<pre id="output"></pre>
<script>
const start = document.querySelector('#start');
const stop = document.querySelector('#stop');
const video = document.querySelector('#video');
const status = document.querySelector('#status');
const output = document.querySelector('#output');
let stream, track, timer;
function update() {
  const settings = track.getSettings();
  const capabilities = track.getCapabilities ? track.getCapabilities() : {};
  const parameters = ['iso', 'exposureTime', 'exposureMode', 'exposureCompensation', 'aperture'];
  output.textContent = '撮影パラメータ（0.5秒ごと更新）\n' +
    parameters.map(key => key + ': ' +
      (Object.hasOwn(settings, key) ? JSON.stringify(settings[key]) : '取得できない')).join('\n') +
    '\n\n※値が出ても、自動露出の現在値かは変化を見て確認してください。' +
    '\n※数値はAPIの生の値です。apertureは標準の取得項目ではありません。' +
    '\n\ngetSettings() 全項目\n' + JSON.stringify(settings, null, 2) +
    '\n\ngetCapabilities() 対応範囲\n' + JSON.stringify(capabilities, null, 2) +
    '\n\nブラウザの対応項目\n' +
    JSON.stringify(navigator.mediaDevices.getSupportedConstraints(), null, 2);
}
function closeCamera() {
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null; video.srcObject = null;
  start.disabled = false; stop.disabled = true;
}
start.onclick = async () => {
  start.disabled = true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('カメラAPIが使えません。HTTPSのURLをSafariで開いてください。');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    stop.disabled = false;
    await video.play();
    status.textContent = '明るい所と暗い所に向けて、ISO・exposureTimeが変わるか確認してください。';
    update();
    timer = setInterval(() => {
      try { update(); }
      catch (error) {
        closeCamera();
        status.textContent = error.name + ': ' + error.message;
      }
    }, 500);
    track.onended = () => {
      closeCamera();
      status.textContent = 'カメラが終了しました。もう一度開始できます。';
    };
  } catch (error) {
    closeCamera();
    status.textContent = error.name + ': ' + error.message;
  }
};
stop.onclick = () => {
  closeCamera();
  status.textContent = '停止しました。';
};
window.addEventListener('pagehide', closeCamera);
</script>
</html>
